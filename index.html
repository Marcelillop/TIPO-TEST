<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Bases de Datos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <div id="menu-inicial">
        <h1>Test de Bases de Datos</h1>

        <button type="button" id="btn-random">Modo random: OFF</button>
        <button type="button" id="btn-iniciar">Iniciar Test</button>
    </div>

    
    <div id="quiz-container" style="display: none;">
        <p id="progreso"></p>
        <p id="cronometro">Tiempo: 00:00</p>

        <h2 id="pregunta"></h2>

        <div id="opciones"></div>

        <div id="explicacion" style="display: none;"></div>

        <button id="btn-siguiente" style="display: none;">Siguiente</button>

        <div id="resultado" style="display: none;">
            <p id="puntaje-final"></p>
            <button id="btn-reiniciar">Reiniciar</button>
        </div>
    </div>

    <script src="examen.js"></script>
</body>
</html>
